apiVersion: v1
kind: ConfigMap
metadata:
  name: user
  namespace: roboshop
  labels:
    project: roboshop
    environment: dev
    component: user
    tier: backend
data:
  REDIS_URL: 'redis://redis:6379'
  MONGO_URL: "mongodb://mongodb:27017/users"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user
  namespace: roboshop
  labels:
    project: roboshop
    environment: dev
    component: user
    tier: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      project: roboshop
      environment: dev
      component: user
      tier: backend
  template:
    metadata:
      labels:
        project: roboshop
        environment: dev
        component: user
        tier: backend
    spec:
      containers:
      - name: user
        image: jaswanthdocker12/user:v1
        imagePullPolicy: Always
        envFrom:
        - configMapRef:
            name: user
        ports:
        - name: port
          containerPort: 8080
        readinessProbe:
          httpGet:
            path: /health
            port: port-name
          failureThreshold: 1
          periodSeconds: 15
        livenessProbe:
          httpGet:
            path: /health
            port: port-name
          failureThreshold: 1
          periodSeconds: 15
        resources:
          requests:
            cpu: "100m"
            memory: "70Mi"
          limits:
            cpu: "100m"
            memory: "70Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: user
  namespace: roboshop
spec:
  selector:
    project: roboshop
    environment: dev
    component: user
    tier: backend
  ports:
  - protocol: TCP
    port: 8080
    targetPort: 8080