apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql
  namespace: roboshop
data:
  my.cnf: | 
    [mysqld]
    innodb_redo_log_capacity = 2G
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: roboshop
  labels:
    project: roboshop
    environment: dev
    component: mysql
    tier: db
spec:
  replicas: 1
  selector:
    matchLables:
      project: roboshop
      environment: dev
      component: mysql
      tier: db
  template:
    metadata:
      labels:
        project: roboshop
        environment: dev
        component: mysql
        tier: db
    spec:
      containers:
      - name: mysql
        image: jaswanthdocker12/mysql:v1
        imagePullPolicy: Always
        readinessProbe:
          tcpSocket:
            port: 3306
          initialDelaySeconds: 20
          periodSeconds: 5
        livenessProbe:
          tcpSocket:
            port: 3306
          initialDelaySeconds: 20
          periodSeconds: 5
        resources:
          requests:
            cpu: "100m"
            memory: "70Mi"
          limits:
            cpu: "100m"
            memory: "70Mi"
        volumeMounts:
        - name: mysql-volume
          mountPath: /etc/mysql/conf.d/my.cnf
          subPath: my.cnf
      volumes:
      - name: mysql-volume
        configMap: mysql
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: roboshop
spec:
  selector:
    project: roboshop
    environment: dev
    component: mysql
    tier: db
  ports:
  - protocol: TCP
    port: 3306
    targetPort: 3306