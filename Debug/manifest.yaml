apiVersion: v1
kind: Pod
metadata:
  name: debug
  namespace: roboshop
  labels:
    name: debug
    project: roboshop
spec:
  containers:
  - name: debug
    image: joindevops/debug:v1
    imagePullPolicy: Always
    resources:
      requests:
        cpu: "100m"
        memory: "70Mi"
      limits:
        cpu: "100m"
        memory: "70Mi"