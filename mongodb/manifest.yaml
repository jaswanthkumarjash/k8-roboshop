apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb
  namespace: roboshop
  # These are replicaset labels, which are used to identify the pods that belong to this deployment.
  labels:
    project: roboshop
    environment: dev
    component: mongodb
    tier: db
spec:
  replicas: 1
  selector:
    # This selector is used to identify the pods that belong to this deployment. It must match the labels of the pods defined in the template below.
    matchLabels:
      project: roboshop
      environment: dev
      component: mongodb
      tier: db
    # Pod definition.
  template:
    metadata:
      labels:
        project: roboshop
        environment: dev
        component: mongodb
        tier: db
    spec:
      containers:
      - name: mongodb
        image: jaswanthdocker12/mongodb:v1
        imagePullPolicy: Always
        readinessProbe:
          tcpSocket:
            port: 27017
          initialDelaySeconds: 20
          periodSeconds: 5
        livenessProbe:
          tcpSocket:
            port: 27017
          initialDelaySeconds: 20
          periodSeconds: 5
        resources:
          requests:
            cpu: "100m"
            memory: "70Mi"
          limits:
            cpu: "100m"
            memory: "70Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb
  namespace: mongodb
spec:
  selector:
    project: roboshop
    environment: dev
    component: mongodb
    tier: db
  ports:
  - protocol: TCP
    port: 27017
    tergetPort: 27017